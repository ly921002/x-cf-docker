name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # 冒烟测试：确认镜像能启动并完成配置自检（不实际监听）
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build locally for test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: x-cf:test
          cache-from: type=gha

      - name: Smoke test (DRY_RUN)
        run: |
          docker run --rm \
            -e MODE=reality \
            -e SNI=www.apple.com \
            -e SERVER_IP=127.0.0.1 \
            -e XRAY_PORT=8443 \
            -e DRY_RUN=true \
            -v "$PWD/testdata:/data" \
            x-cf:test

      - name: Assert config generated
        run: |
          test -f testdata/config.json || { echo "config.json 未生成"; exit 1; }
          grep -q '"security": "reality"' testdata/config.json || { echo "reality 配置缺失"; exit 1; }
          grep -q '"host": "www.apple.com"' testdata/config.json || { echo "host 白名单缺失"; exit 1; }
          test -f testdata/node.txt || { echo "node.txt 未生成"; exit 1; }
          echo "冒烟测试通过"
          cat testdata/node.txt
